name: אפליקציית אנדרואיד (APK + AAB)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # מספר הגרסה ל-Google Play: מספר הריצה, שעולה בכל ריצה
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx cap sync android
      # חתימה בשרת: רק אם הוגדרו סודות (Settings -> Secrets -> Actions). בלי סודות ה-AAB יוצא לא חתום, וחותמים במחשב.
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.TEIRE_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "TEIRE_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build debug APK and release AAB
        working-directory: mobile/android
        env:
          TEIRE_KEYSTORE_PASSWORD: ${{ secrets.TEIRE_KEYSTORE_PASSWORD }}
          TEIRE_KEY_ALIAS: ${{ secrets.TEIRE_KEY_ALIAS }}
          TEIRE_KEY_PASSWORD: ${{ secrets.TEIRE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: teire-debug-apk-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: teire-release-aab-${{ github.run_number }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
