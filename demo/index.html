<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4f46e5">
  <title>Quiz Trail</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <!-- Neutral demo for app testers. Loads nothing from the main site: no content/, no js/, no audio/. -->
  <header class="top">
    <button class="brand" type="button" data-go="map">🧭 <span data-t="brand">Quiz Trail</span></button>
    <div class="hud" id="hud"></div>
  </header>
  <main id="app"></main>
  <nav class="tabs" id="tabs">
    <button type="button" data-go="map"><span>🗺️</span><b data-t="tabMap">Map</b></button>
    <button type="button" data-go="speed"><span>⚡</span><b data-t="tabSpeed">Speed</b></button>
    <button type="button" data-go="shop"><span>🛍️</span><b data-t="tabShop">Shop</b></button>
    <button type="button" data-go="settings"><span>⚙️</span><b data-t="tabSettings">Settings</b></button>
  </nav>
  <script src="demo.js"></script>
</body>
</html>
